name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitLair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Optional: an R8-optimised build that is noticeably smoother than the debug one.
      # It is signed with the debug key, so it installs like any other APK. A failure here never fails the job.
      - name: Build optimised APK (smoother)
        continue-on-error: true
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitLair-optimised-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
